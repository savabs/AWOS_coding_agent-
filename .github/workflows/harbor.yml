# Harbor head-to-head: coding-agent harnesses on Terminal-Bench 2.1, all on
# anthropic/claude-haiku-5-5, sharded over free ubuntu runners (Docker).
# Settings: ci/harbor.env. Launch / collect / fairness notes: ci/HARBOR.md.
name: harbor

on:
  push:
    branches: ["bench-cloud/harbor-**"]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time: a second push queues instead of spending twice.
concurrency:
  group: harbor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.cfg.outputs.matrix }}
      max_parallel: ${{ steps.cfg.outputs.max_parallel }}
      harbor_version: ${{ steps.cfg.outputs.harbor_version }}
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        name: Read ci/harbor.env
        shell: bash
        run: |
          python3 scripts/harbor_run.py ci-config | tee -a "$GITHUB_OUTPUT"

  shard:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.config.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    env:
      AGENT: ${{ matrix.agent }}
      SHARD: ${{ matrix.shard }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      HARBOR_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Free disk (preinstalled toolchains the run never uses)
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install Harbor (pinned)
        shell: bash
        run: |
          python -m pip install "harbor==${{ needs.config.outputs.harbor_version }}"
          harbor --version
          docker info --format '{{.ServerVersion}} cpus={{.NCPU}} mem={{.MemTotal}}'
          PYTHONPATH=. python -c "import harbor_agents.awos_agent"

      - name: Run shard
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ANTHROPIC_API_KEY" || { echo "secret ANTHROPIC_API_KEY is not set"; exit 1; }
          echo "agent=$AGENT shard=$SHARD sha=$GITHUB_SHA"
          env -u OPENROUTER_API_KEY PYTHONUNBUFFERED=1 \
            python scripts/harbor_run.py shard --agent "$AGENT" --shard "$SHARD" \
              --jobs-dir "$RUNNER_TEMP/jobs" 2>&1 | tee "$RUNNER_TEMP/driver.log"

      - name: Stage small result files
        if: always()
        shell: bash
        run: |
          python scripts/harbor_collect.py stage --jobs-dir "$RUNNER_TEMP/jobs" \
            --dest "$RUNNER_TEMP/harbor-$AGENT-$SHARD"
          cp "$RUNNER_TEMP/driver.log" "$RUNNER_TEMP/harbor-$AGENT-$SHARD/" 2>/dev/null || true
          du -sh "$RUNNER_TEMP/harbor-$AGENT-$SHARD"

      - name: Upload shard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbor-${{ matrix.agent }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/harbor-${{ matrix.agent }}-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 30
