# Month-end Document Pack v0.1 testbed (testbeds/doc_pack) on free GitHub-hosted macOS runners
# (each runner is itself a disposable macOS VM, kern.hv_vmm_present=1).
#   1. unit tests + the HTTP-level dry run (oracle PASSES every variant, every bad solution FAILS)
#   2. the same oracle in REAL Safari through the live AX driver (scaffold/agent/desktop/live),
#      per variant, with a screen recording + screenshots
# No model calls, no secrets, no paid APIs. Logs, results, screenshots and videos are uploaded.
# Launch: push a branch named bench-cloud/mac-pack-<anything>.
name: mac-pack

on:
  push:
    branches: ["bench-cloud/mac-pack-**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-pack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    strategy:
      fail-fast: false
      max-parallel: 2          # keep the other free macOS slots for the owner
      matrix:
        variant: [a, b, c]
    runs-on: macos-15
    timeout-minutes: 40
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      V: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deps
        run: |
          pip install -q -r requirements.txt pytest pyobjc-framework-ApplicationServices pyobjc-framework-Quartz \
            pyobjc-framework-Cocoa

      - name: Machine facts
        shell: bash
        run: |
          set +e
          mkdir -p out
          { sw_vers; uname -m; echo "hv_vmm_present=$(sysctl -n kern.hv_vmm_present)"; python --version
            defaults read /Applications/Safari.app/Contents/Info CFBundleShortVersionString
            python -c "import sys; sys.path.insert(0, 'testbeds/doc_pack'); import dp_pdf; print('pdf backend', dp_pdf.backend())"
          } 2>&1 | tee out/machine_$V.txt

      - name: Unit tests (testbed)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/test_testbed_doc_pack.py -q 2>&1 | tee out/pytest_$V.txt

      - name: HTTP-level dry run (oracle + bad solutions, all variants)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python testbeds/doc_pack/run.py --dry-run --root "$RUNNER_TEMP/dp_dry" 2>&1 | tee out/dry_run_$V.txt
          cp "$RUNNER_TEMP/dp_dry/dry_run.json" out/dry_run_$V.json

      # The runner is a disposable VM; these settings only touch it.
      - name: Guest hygiene (Safari prompts, no auto-open of downloaded PDFs)
        if: always()
        shell: bash
        run: |
          set +e
          osascript -e 'quit app "Safari"' 2>/dev/null; sleep 1
          C="$HOME/Library/Containers/com.apple.Safari/Data/Library/Preferences/com.apple.Safari"
          for D in com.apple.Safari "$C"; do
            for K in AutoFillPasswords CanPromptForPushNotifications AutoOpenSafeDownloads; do
              defaults write "$D" "$K" -bool false; echo "write $D $K exit=$? now=$(defaults read "$D" "$K" 2>&1)"
            done
          done
          mkdir -p "$HOME/Downloads"
          echo "--- Safari per-site preferences (schema, for the download-permission question)"
          for DB in "$HOME/Library/Safari/PerSitePreferences.db" \
                    "$HOME/Library/Containers/com.apple.Safari/Data/Library/Safari/PerSitePreferences.db"; do
            [ -f "$DB" ] && { echo "$DB"; sqlite3 "$DB" ".tables" "select * from default_preferences;" 2>&1 | head -40; }
          done
          true

      - name: Oracle in real Safari (variant ${{ matrix.variant }})
        if: always()
        shell: bash
        run: |
          set +e
          screencapture -v -V 420 -x out/video_pack_$V.mov & REC=$!
          sleep 2
          python testbeds/doc_pack/run.py safari --variant $V --root "$RUNNER_TEMP/dp_safari_$V" --out out \
            2>&1 | tee out/safari_$V.log
          echo "safari exit=${PIPESTATUS[0]}" | tee -a out/safari_$V.log
          sleep 2; kill -INT $REC 2>/dev/null; wait $REC 2>/dev/null
          screencapture -x out/screen_after_$V.png || echo "screencapture failed"
          H="$RUNNER_TEMP/dp_safari_$V/harness"
          mkdir -p out/harness_$V
          cp "$H"/requests.jsonl "$H"/transcript.txt "$H"/truth.json "$H"/phone_sms.txt out/harness_$V/ 2>/dev/null
          ls -lR "$RUNNER_TEMP/dp_safari_$V/sandbox/outbox" > out/harness_$V/outbox_listing.txt 2>&1
          true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-pack-${{ matrix.variant }}
          path: out/
          if-no-files-found: warn
