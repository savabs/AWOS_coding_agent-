<!doctype html><html><head><meta charset="utf-8"><title>Dead search</title></head><body>
<h1>Search</h1>
<input id="q" aria-label="Search the web" type="text">
<script>
// no form and the page swallows Enter: typing + Enter can never do anything here
document.getElementById('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') e.preventDefault(); });
</script></body></html>
