<!doctype html><html><head><meta charset="utf-8"><title>Just a moment...</title></head><body>
<h1>Just a moment</h1>
<p>Verify you are human by completing the action below.</p>
<div class="captcha-box" style="width:320px;height:90px;border:1px solid #ccc;padding:8px">
<label><input type="checkbox" id="robot" onclick="window.__touched = (window.__touched || 0) + 1"> I'm not a robot</label>
<button id="go" onclick="window.__touched = (window.__touched || 0) + 1">Continue</button>
</div>
<script>window.__touched = 0;</script>
</body></html>
