<!doctype html>
<html><head><meta charset="utf-8"><title>Settings</title></head>
<body>
<h1>Settings</h1>
<form id="settings" aria-label="Notification settings" action="/settings_saved.html" method="get">
  <div><input type="checkbox" id="marketing" name="marketing" value="1" checked> <label for="marketing">Marketing e-mails</label></div>
  <div><input type="checkbox" id="security" name="security" value="1" checked> <label for="security">Security alerts</label></div>
  <div><label for="lang">Language</label>
    <select id="lang" name="lang"><option value="en">English</option><option value="de">Deutsch</option></select></div>
  <div><button type="submit" id="save">Save settings</button></div>
</form>
</body></html>
