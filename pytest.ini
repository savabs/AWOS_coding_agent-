[pytest]
# Per-test wall-clock timeout — kills any test that hangs or burns CPU
timeout = 10

# Default run: skip integration tests (real API calls, nested pytest spawns)
# To run them explicitly: pytest -m integration
# tests/bug_cases/ holds benchmark fixtures, not tests. Every case has a
# test_case.py, so collecting them collides on the duplicate basename and
# aborts the whole run. They are executed deliberately, each staged in its own
# directory, by tests/test_bench_cases.py and scripts/bench_executors.py.
addopts = -m "not integration" --timeout=10 --ignore=tests/test_vector_memory.py --ignore=tests/bug_cases

markers =
    integration: marks tests that make real API calls or spawn subprocesses (skipped by default)
    slow: marks tests that are expected to take > 2s
