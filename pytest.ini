[pytest]
# Per-test wall-clock timeout — kills any test that hangs or burns CPU
timeout = 10

# Default run: skip integration tests (real API calls, nested pytest spawns)
# To run them explicitly: pytest -m integration
# Excluded paths, and why each one is not a test:
#
#   tests/bug_cases/      benchmark fixtures. Every case has a test_case.py, so
#                         collecting them collides on the duplicate basename and
#                         aborts the whole run. They are run deliberately, each
#                         staged in its own directory, by tests/test_bench_cases.py
#                         and scripts/bench_executors.py.
#   tests/fixtures/       the same, for the older fixture sets — they carry their
#                         own test_case.py and test_payment.py and import modules
#                         that only exist once staged.
#   tests/long_tasks/     realistic benchmark projects (M0.5). Each carries its
#                         own tests and hidden tests for an app that only
#                         imports once staged; run by scripts/long_tasks.py.
#   test_observer_control.py  imports gui.observer_control, which does not exist
#                         in the tree. Excluded rather than stubbed, since
#                         inventing the module would hide unfinished work.
#
# Without the fixture exclusions pytest aborts during collection and NO test
# runs at all, which is how this suite stood before.
addopts = -m "not integration" --timeout=10
          --ignore=tests/test_vector_memory.py
          --ignore=tests/bug_cases
          --ignore=tests/fixtures
          --ignore=tests/long_tasks
          --ignore=tests/test_observer_control.py

markers =
    integration: marks tests that make real API calls or spawn subprocesses (skipped by default)
    slow: marks tests that are expected to take > 2s
